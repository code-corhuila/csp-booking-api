# This service only. csp-infra includes this file to compose the platform.
# The variables of the database and the JWT key are added by the pull requests that make the service read them.
name: csp-booking-api

services:
  booking-api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      PORT: "8083"
      # Public key every token is validated with (Norma 5.3.7); csp-infra mounts the PEM file.
      # The service refuses to start without one of the two.
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:-}
      JWT_PUBLIC_KEY_FILE: ${JWT_PUBLIC_KEY_FILE:-}
    # expose, not ports: only the gateway is reachable from the host.
    expose: ["8083"]
    networks: [platform]

networks:
  platform:
    name: platform
    external: true
