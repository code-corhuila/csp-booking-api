spring:
  application:
    name: booking-api
  lifecycle:
    timeout-per-shutdown-phase: 20s   # graceful shutdown: in-flight requests may finish for 20 s
  datasource:
    # One database per domain (Annex J.5). The three variables are listed in .env.example.
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/csp}
    username: ${SPRING_DATASOURCE_USERNAME:booking_app}
    password: ${SPRING_DATASOURCE_PASSWORD:change-me}
    hikari:
      maximum-pool-size: 10               # Annex C limits: size of the connection pool
      connection-timeout: 5000            # Annex C limits: wait for a connection, 5 s
      connection-init-sql: SET statement_timeout = '5s'   # Annex C limits: time per statement, 5 s
server:
  port: ${PORT:8083}
  shutdown: graceful                  # stop accepting new requests, let the running ones finish
  tomcat:
    connection-timeout: 5s            # time to receive the request line and headers
    keep-alive-timeout: 60s           # idle connection
    threads:
      max: 200
logging:
  structured:
    format:
      console: ecs                    # one JSON object per line; the MDC adds the correlation id
